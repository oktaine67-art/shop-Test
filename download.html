<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZENO REGEDIT • Tải File</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif; background: #0a0c0f; color: white;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
    }
    .container {
      background: #1a1d24; padding: 30px; border-radius: 24px; text-align: center;
      max-width: 500px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .error { color: #e74c3c; }
    .btn {
      background: #00e6ff; color: black; padding: 12px 28px; border-radius: 30px;
      text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container" id="content">
    <div id="loading"><i class="fas fa-spinner fa-pulse"></i> Đang kiểm tra...</div>
    <div id="errorMsg" class="error hidden"></div>
    <div id="fileInfo" class="hidden"></div>
  </div>

  <script>
    // Cùng mảng files với index.html (sẽ được cập nhật từ admin)
    const files = [
      { name: "DATA Nhẹ Tâm", icon: "fa-database", link: "https://link4m.net/kvOiP" },
      { name: "Định vị (Tải Full)", icon: "fa-map-marker-alt", link: "https://link4m.net/hOdYuTP" },
      { name: "AIMLOCK", icon: "fa-crosshairs", link: "https://link4m.org/ikWNEz" },
      { name: "Nhẹ Tâm 200k", icon: "fa-gem", link: "https://link4m.org/pZzEr" }
    ];

    const params = new URLSearchParams(window.location.search);
    const fileIndex = params.get('file');
    const token = params.get('token');

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('errorMsg');
    const fileInfoEl = document.getElementById('fileInfo');

    // Kiểm tra token hợp lệ từ session (phải khớp với token đã tạo ở index)
    const storedToken = sessionStorage.getItem('zeno_token');
    const isUnlocked = sessionStorage.getItem('zeno_unlocked') === 'true';

    if (!isUnlocked || !storedToken || token !== storedToken) {
      loadingEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.innerHTML = `<i class="fas fa-lock"></i> Bạn chưa xác minh hoặc link không hợp lệ.<br>
      <a href="index.html" class="btn" style="margin-top:15px;">Quay lại xác minh</a>`;
    } else if (fileIndex === null || !files[parseInt(fileIndex)]) {
      loadingEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.textContent = 'File không tồn tại.';
    } else {
      const file = files[parseInt(fileIndex)];
      loadingEl.classList.add('hidden');
      fileInfoEl.classList.remove('hidden');
      fileInfoEl.innerHTML = `
        <i class="fas ${file.icon}" style="font-size:3rem; color:#4fbfe8;"></i>
        <h2>${file.name}</h2>
        <p>Nhấn nút bên dưới để tải xuống.</p>
        <a href="${file.link}" target="_blank" class="btn"><i class="fas fa-download"></i> TẢI NGAY</a>
        <p style="margin-top:15px; font-size:0.8rem; color:#aaa;">Link có hiệu lực trong phiên này.</p>
      `;
    }
  </script>
</body>
</html>
